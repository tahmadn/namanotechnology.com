<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7f5;
            color: #1a4d2a;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 36px;
        }

        h2 {
            margin-top: 0;
            font-weight: normal;
            color: #444;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #777;
            font-size: 14px;
        }

        .close-note {
            margin-top: 30px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="icon">🤲</div>

	<h1>Donation Cancelled</h1>

	<p>
	Your donation was not completed and no payment has been processed.
	</p>

	<p>
	If you still wish to donate, please return to the donation kiosk and try again.
	</p>


    <p class="close-note">
        You may now close this page.
    </p>

    <div class="footer">
        Powered by Xariya
    </div>

</div>

</body>
</html>
